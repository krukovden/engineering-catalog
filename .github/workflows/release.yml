# Release versioning without ever pushing to main (DESIGN §6, AGENTS.md invariant 9).
# GitHub Actions twin of azure-pipelines.yml — same two halves, same scripts.
#
#   pull_request (main)  — computes the version this PR will release, from the highest `v*`
#                          tag on main: same major.minor → patch + 1; a new major.minor in
#                          package.json → X.Y.0. Writes it into package.json, rebuilds every
#                          manifest, tests, and — only when something changed — commits
#                          `release: prepare vX.Y.Z` to the PR's SOURCE branch. The next run
#                          finds nothing to change and passes; no loop.
#   push (main)          — after the merge: reads package.json, checks the artifacts are
#                          current, and tags the merge commit `vX.Y.Z`. No commits to main.
#
# Branch protection on main this relies on: this workflow's `prepare` job required, and
# "Require branches to be up to date before merging" — so two PRs prepared in parallel
# cannot both land the same version (if a duplicate ever slips through, the main run fails
# on the existing tag instead of tagging twice).
#
# Token: a push made with the default GITHUB_TOKEN does not start a new workflow run, so the
# release commit would carry no check and a required-check rule would block the merge. Add a
# fine-grained PAT (Contents: read and write on this repo) as the `RELEASE_TOKEN` secret to
# get a run on it; without the secret the workflow still works, falling back to GITHUB_TOKEN.
# PRs from forks are verified but never pushed to — the version is prepared on merge by a
# maintainer instead.

name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: PR — prepare the release version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dev-side Claude/Copilot config drift (.claude/skills/coding-agent-parity/SKILL.md) —
      # a named step so it fails distinctly from the 300-odd assertions inside `npm test`.
      - name: Coding agent parity check (Claude vs Copilot dev config)
        run: node .claude/skills/coding-agent-parity/scripts/check-parity.js

      - name: Eval lint (every case loads and is gradable, no model calls)
        run: npm run eval -- lint

      - name: Eval static (per-target description cost, no model calls)
        run: npm run eval -- static

      - name: E2E install smoke (real engcat CLI in a container, no model calls)
        run: npm run e2e:install

      - name: Compute version from main tags, rebuild, commit to the PR branch
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SRC: ${{ github.head_ref }}
        run: |
          set -e
          git fetch "https://github.com/${{ github.repository }}.git" --tags --force
          NEXT=$(node scripts/next-version.js)
          echo "next version: $NEXT"
          echo "### next version: v$NEXT" >> "$GITHUB_STEP_SUMMARY"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$NEXT" ]; then npm version "$NEXT" --no-git-tag-version; fi
          npm run build
          npm test
          npm run check
          if git diff --quiet; then
            echo "package.json already at $NEXT and artifacts current — nothing to commit"
            exit 0
          fi
          if [ "$SAME_REPO" != "true" ]; then
            echo "::warning::PR from a fork — release commit not pushed; package.json should be v$NEXT"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "release: prepare v$NEXT"
          git push origin "HEAD:$SRC"
          echo "pushed release commit to $SRC"

  tag:
    name: main — tag the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coding agent parity check (Claude vs Copilot dev config)
        run: node .claude/skills/coding-agent-parity/scripts/check-parity.js

      - name: Eval lint (every case loads and is gradable, no model calls)
        run: npm run eval -- lint

      - name: Eval static (per-target description cost, no model calls)
        run: npm run eval -- static

      - name: Verify artifacts and tag v<version>
        run: |
          set -e
          git fetch origin --tags --force
          VERSION=$(node -p "require('./package.json').version")
          echo "### version: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          npm test
          npm run check
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            AT=$(git rev-list -n1 "v$VERSION")
            if [ "$AT" = "$(git rev-parse HEAD)" ]; then echo "v$VERSION already tags this commit"; exit 0; fi
            echo "::error::v$VERSION already exists at $AT — two PRs prepared the same version; rebase and re-run the PR checks"
            exit 1
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "v$VERSION" -m "engineering-catalog $VERSION"
          git push origin "v$VERSION"
          echo "tagged v$VERSION"
